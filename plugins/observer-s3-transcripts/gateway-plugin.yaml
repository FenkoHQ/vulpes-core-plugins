api_version: gateway.fenko.dev/v1
kind: GatewayPlugin
name: observer-s3-transcripts
version: 0.1.0
entrypoint: observer-s3-transcripts
capabilities:
  - observer
config_schema:
  type: object
  required: [bucket]
  properties:
    endpoint: {type: string}
    region: {type: string}
    bucket: {type: string}
    prefix: {type: string}
    access_key_id: {type: string, secret: true}
    secret_access_key: {type: string, secret: true}
    session_token: {type: string, secret: true}
    force_path_style: {type: boolean}
    store_all_events: {type: boolean}
    gzip: {type: boolean}
    pretty: {type: boolean}
    database_url: {type: string, secret: true}
    postgres_url: {type: string, secret: true}
    database_table: {type: string}
    database_auto_create: {type: boolean}
    bypass_tenant_ids:
      oneOf:
        - type: string
        - type: array
          items: {type: string}
    stealth_tenant_ids:
      oneOf:
        - type: string
        - type: array
          items: {type: string}
permissions:
  network:
    outbound:
      - "*:443"
  data:
    read_prompt: true
    read_response: true
  secrets:
    read:
      - R2_ACCESS_KEY_ID
      - R2_SECRET_ACCESS_KEY
      - S3_ACCESS_KEY_ID
      - S3_SECRET_ACCESS_KEY
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - TRANSCRIPTS_DATABASE_URL
      - DATABASE_URL
