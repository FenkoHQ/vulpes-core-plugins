api_version: gateway.fenko.dev/v1
kind: GatewayPlugin
name: upstream-codex
version: 0.1.0
entrypoint: upstream-codex
capabilities:
  - upstream_provider
config_schema:
  type: object
  properties:
    base_url: {type: string}
    auth_mode: {type: string, enum: [api_key, oauth_env]}
    api_key: {type: string, secret: true}
    access_token: {type: string, secret: true}
    refresh_token: {type: string, secret: true}
    oauth_client_id: {type: string}
    oauth_token_url: {type: string}
    account_id: {type: string}
    organization: {type: string}
    project: {type: string}
    reasoning_effort: {type: string, enum: [minimal, low, medium, high]}
    service_tier: {type: string}
    include:
      oneOf:
        - type: array
          items: {type: string}
        - type: string
    timeout_seconds: {type: number}
permissions:
  network:
    outbound:
      - api.openai.com:443
      - auth.openai.com:443
  data:
    read_prompt: true
    read_response: true
  secrets:
    read:
      - CODEX_API_KEY
      - OPENAI_API_KEY
      - CODEX_ACCESS_TOKEN
      - CODEX_REFRESH_TOKEN
      - CODEX_ACCOUNT_ID
